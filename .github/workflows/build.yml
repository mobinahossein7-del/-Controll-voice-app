name: Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # =================================================
      # استعادة كاش Buildozer و Gradle
      # =================================================

      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # =================================================
      # متطلبات النظام
      # =================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            ccache \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            cmake \
            unzip \
            zip

      # =================================================
      # تثبيت Buildozer
      # =================================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install setuptools

          python -m pip install "cython==0.29.34"

          python -m pip install \
            git+https://github.com/kivy/buildozer.git

      # =================================================
      # فحص الملفات والإعدادات
      # =================================================

      - name: Verify project
        run: |

          echo "======================================"

          echo "PROJECT FILES"

          echo "======================================"

          ls -la

          echo "======================================"

          echo "WORKFLOW"

          echo "======================================"

          ls -la .github/workflows

          echo "======================================"

          echo "PYTHON"

          echo "======================================"

          python --version

          echo "======================================"

          echo "JAVA"

          echo "======================================"

          java -version

          echo "======================================"

          echo "BUILDOZER"

          echo "======================================"

          buildozer --version

          echo "======================================"

          echo "FONT"

          echo "======================================"

          test -f NotoKufiArabic-VariableFont_wght.ttf

          echo "Font OK"

          echo "======================================"

          echo "P4A CONFIG"

          echo "======================================"

          grep -n \
            "p4a.branch\|requirements\|android.ndk" \
            buildozer.spec

          echo "======================================"

          echo "PYTHON SYNTAX"

          echo "======================================"

          python -m py_compile main.py

          echo "Python syntax OK"

      # =================================================
      # بناء APK
      # =================================================

      - name: Build APK
        run: |

          yes | buildozer -v android debug

      # =================================================
      # رفع APK
      # =================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:

          name: VoiceControl-APK

          path: bin/*.apk

          if-no-files-found: error
