name: Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4


      # Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # متطلبات Linux اللازمة لـ Buildozer
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            ccache \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            cmake \
            unzip \
            zip


      # تثبيت Buildozer و Cython
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools
          python -m pip install "cython==0.29.34"
          python -m pip install git+https://github.com/kivy/buildozer.git


      # تنظيف أي بناء سابق
      - name: Clean previous build
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin


      # التحقق من الملفات
      - name: Check project files
        run: |
          echo "===== PROJECT FILES ====="
          ls -la

          echo "===== WORKFLOW ====="
          ls -la .github/workflows

          echo "===== PYTHON ====="
          python --version

          echo "===== BUILDZER ====="
          buildozer --version


      # بناء APK
      - name: Build APK
        run: |
          yes | buildozer -v android debug


      # رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceControl-APK
          path: bin/*.apk
          if-no-files-found: error
