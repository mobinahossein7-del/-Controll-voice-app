name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # لا نحذف Buildozer أو Gradle.
      # سيتم الاحتفاظ بها للبناءات القادمة.
      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            ccache \
            libncurses5 \
            libncursesw5-dev \
            libstdc++6 \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            cmake \
            unzip \
            zip

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;25.1.8937393"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython==0.29.33"
          python -m pip install "buildozer"

      - name: Verify project
        run: |
          python --version
          java -version
          buildozer --version

          test -f main.py
          test -f buildozer.spec
          test -f NotoKufiArabic-VariableFont_wght.ttf

          python -m py_compile main.py

      # بناء تزايدي:
      # لا نحذف .buildozer أو ~/.buildozer
      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceControl-APK
          path: bin/*.apk
          if-no-files-found: error
