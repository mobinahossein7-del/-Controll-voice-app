name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==============================
      # Checkout repository
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4

      # ==============================
      # Python 3.10
      # ==============================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ==============================
      # Java 17
      # ==============================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==============================
      # Android SDK
      # ==============================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ==============================
      # System dependencies
      # ==============================
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            ccache \
            libncurses5 \
            libstdc++6 \
            zlib1g-dev \
            unzip \
            zip \
            libltdl-dev

      # ==============================
      # Android SDK / NDK
      # ==============================
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;25.1.8937393"

      # ==============================
      # Restore Buildozer cache
      # ==============================
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/pip
            ~/.cache/ccache
          key: ${{ runner.os }}-buildozer-api33-ndk25b-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-api33-ndk25b-

      # ==============================
      # Install Buildozer
      # ==============================
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "cython==0.29.33" \
            "buildozer"

      # ==============================
      # Configure ccache
      # ==============================
      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats

      # ==============================
      # Build APK
      # ==============================
      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          buildozer -v android debug

      # ==============================
      # Show ccache statistics
      # ==============================
      - name: Show ccache statistics
        if: always()
        run: |
          ccache --show-stats || true

      # ==============================
      # Upload APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceControl-APK
          path: bin/*.apk
          if-no-files-found: error
