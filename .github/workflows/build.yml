name: Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            ccache \
            libncurses5 \
            libstdc++6 \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            cmake \
            unzip \
            zip

      - name: Install Android packages and accept licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;25.1.8937393"

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython==0.29.33"
          python -m pip install "buildozer"

      - name: Clean previous Buildozer cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin

      - name: Verify project
        run: |
          echo "===== Python ====="
          python --version

          echo "===== Java ====="
          java -version

          echo "===== Buildozer ====="
          buildozer --version

          echo "===== Files ====="
          test -f main.py
          test -f buildozer.spec
          test -f NotoKufiArabic-VariableFont_wght.ttf

          echo "===== Python syntax ====="
          python -m py_compile main.py

          echo "===== Buildozer configuration ====="
          grep -n \
            "requirements\|android.api\|android.minapi\|android.ndk\|p4a.branch" \
            buildozer.spec

          echo "===== Font ====="
          echo "Font OK"

          echo "===== Project syntax OK ====="

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceControl-APK
          path: bin/*.apk
          if-no-files-found: error
