name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 2. Python
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # =========================
      # 3. Java
      # =========================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # =========================
      # 4. Android SDK
      # =========================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # =========================
      # 5. System dependencies
      # =========================
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            ccache \
            libncurses5 \
            libstdc++6 \
            zlib1g-dev \
            unzip \
            zip \
            libltdl-dev

      # =========================
      # 6. Android packages
      # =========================
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;25.1.8937393"

      # =========================
      # 7. Cache Buildozer
      # =========================
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-api33-ndk25b-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-api33-ndk25b-

      # =========================
      # 8. Install Buildozer
      # =========================
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "cython==0.29.33" \
            "buildozer"

      # =========================
      # 9. Prepare ccache
      # =========================
      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats

      # =========================
      # 10. Build APK
      # =========================
      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          buildozer -v android debug

      # =========================
      # 11. ccache statistics
      # =========================
      - name: Show ccache statistics
        if: always()
        run: |
          ccache --show-stats || true

      # =========================
      # 12. Upload APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceControl-APK
          path: bin/*.apk
          if-no-files-found: error
